name: Check authentication
run-name: Check authentication
on:
  workflow_call:
    inputs:
      seed_no_auto_renew:
        description: "Ensure every firm in this caller's CONFIG_JSON carries an `autoRenew` flag, and fail the job if the CLI drops it. Default false, so a caller that does not pass this sees no change. Note the flag is persisted into the caller's own CONFIG_JSON secret, so one enabled run affects every workflow in *that* repository from then on - it is not scoped to this run, and this workflow has no un-seed path."
        type: boolean
        default: false
    outputs:
      failed_firms:
        description: "Space-separated firm IDs whose token refresh failed this run, if any."
        value: ${{ jobs.refresh-tokens.outputs.failed_firms }}
      failed_firms_summary:
        description: "Single line, semicolon-separated: 'firm <id>: <CLI error>; firm <id>: <CLI error>'."
        value: ${{ jobs.refresh-tokens.outputs.failed_firms_summary }}
      auto_renew_lost:
        description: "Space-separated firm IDs that were seeded with an `autoRenew` flag but came back from the CLI without a usable one. Only ever set when the caller passed seed_no_auto_renew. Non-empty means the refresh and the CONFIG_JSON write-back both succeeded, but the no-renew protection is not in effect for those firms - a distinct failure from either of the two below, and one a caller should not report as a write-back problem."
        value: ${{ jobs.refresh-tokens.outputs.auto_renew_lost }}
      refresh_completed:
        description: "\"true\" once the refresh step's own loop has run to completion (whether or not any firm failed) - this stays \"true\" even if a *later* step (the CONFIG_JSON write-back, or its own validation) is what fails the job. Empty only if the refresh step itself never ran or exited early: a zero-step failure (startup_failure, or cancelled while queued), or an early validation failure inside that step (CONFIG_JSON not a single JSON object, or no firms found in it). A caller must check this before treating empty failed_firms as \"nothing failed\"."
        value: ${{ jobs.refresh-tokens.outputs.refresh_completed }}

permissions:
  contents: read

jobs:
  refresh-tokens:
    outputs:
      failed_firms: ${{ steps.refresh.outputs.failed_firms }}
      failed_firms_summary: ${{ steps.refresh.outputs.failed_firms_summary }}
      auto_renew_lost: ${{ steps.write-back.outputs.auto_renew_lost }}
      refresh_completed: ${{ steps.refresh.outputs.refresh_completed }}
    # There's missing feature within GitHub Actions where there's a max of 2 concurrent jobs that can be enqueued, if you exceed it, it will auto-cancel the job unfortunately and you need to manually re-run the "failed" job. A big thread for GitHub to add a feature for this is already open here: https://github.com/orgs/community/discussions/12835
    concurrency:
      group: refresh-tokens
    runs-on: ubuntu-latest
    env:
      SF_API_CLIENT_ID: "${{ secrets.SF_API_CLIENT_ID }}"
      SF_API_SECRET: "${{ secrets.SF_API_SECRET }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Add silverfin-cli package latest version
        run: |
          npm install https://github.com/silverfin/silverfin-cli.git
          VERSION=$(./node_modules/silverfin-cli/bin/cli.js -V)
          echo "[Action] CLI version: ${VERSION}"
      - name: Create Silverfin config file
        run: |
          mkdir -p $HOME/.silverfin/
          touch $HOME/.silverfin/config.json
          echo '${{ secrets.CONFIG_JSON }}' > $HOME/.silverfin/config.json
      # A failing firm must not abort the loop: under `bash -e` the first failure skipped the
      # write-back below, discarding renewals already made and starving later firms of refreshes.
      # Record failures and fail the job in a later step instead. Firm IDs are logged on purpose -
      # they are not secrets, and the alert has to name the firm that was not refreshed.
      - name: Refresh tokens
        id: refresh
        env:
          SEED_NO_AUTO_RENEW: ${{ inputs.seed_no_auto_renew }}
        run: |
          set -o pipefail
          # Enumerated into a variable rather than straight into the `for` word list: a jq failure
          # inside `$(...)` there leaves zero loop items and still exits 0, which would report every
          # firm as refreshed. An assignment lets `bash -e` catch it.
          # Slurped: without it jq validates a stream of several top-level values one by one and
          # reports the last, and the write-back would concatenate them into invalid JSON.
          if ! jq -e -s 'length == 1 and (.[0] | type == "object")' "$HOME/.silverfin/config.json" > /dev/null 2>&1; then
            echo "::error::[Action] the CONFIG_JSON secret is empty, or not a single JSON object"
            exit 1
          fi
          FIRM_IDS=$(jq -r 'del(.defaultFirmIDs, .host) | keys[] | select(test("^[0-9]+$"))' "$HOME/.silverfin/config.json")
          if [[ -z "${FIRM_IDS}" ]]; then
            echo "::error::[Action] no firms in the config, refusing to continue"
            exit 1
          fi
          # The ID set, not a count: a config that lost one firm and gained another numeric-looking
          # key would pass a count check.
          echo "EXPECTED_FIRM_IDS=$(tr '\n' ' ' <<< "${FIRM_IDS}")" >> "$GITHUB_ENV"
          # Seeded here rather than in a step of its own so it reuses the shape check and the firm
          # enumeration above, and so the refresh loop below rewrites the file with the flag already
          # in it - which is what makes the assertion in the write-back step a real round-trip test
          # of the CLI rather than a check that this step's own jq worked.
          #
          # The flag belongs to the credential, not the invocation: reusable workflows don't inherit
          # a caller's env, so an env var would silently miss every shared workflow. It is inert
          # until a CLI that reads it is installed.
          #
          # Non-fatal throughout. This runs before failed_firms/refresh_completed are written, so an
          # abort here would leave the caller's alert with no data at all - the same failure class
          # the `|| true` on the grep pipelines below exists to prevent. Refreshing tokens is this
          # step's job; a config it cannot seed still has tokens worth refreshing.
          #
          # One rule throughout: a firm carries the flag only when `autoRenew` is a boolean.
          # Absent, null, and a stray `"true"` string all count as missing, are all seeded, and are
          # all asserted the same way - so the arrival line, the seed and the write-back check can
          # never disagree with each other about what "has the flag" means.
          #
          # Non-object firm records are skipped rather than repaired: assigning into one is a jq
          # error, and the shape check above only guarantees the *top level* is an object. The IDs
          # that were seeded are recorded so the write-back asserts exactly that set - asserting
          # every enumerated firm would fail the run over a scalar record the seed deliberately
          # left alone.
          # Caps keep failed_firms_summary a single Slack-sized line even with many failures -
          # GitHub's own job-output limit is 1MB, but an unbounded summary would still make a
          # firm-refresh incident unreadable, or push a pathological run over that limit.
          MAX_ERROR_LINE_LEN=200
          MAX_SUMMARY_LEN=4000
          if [[ "${SEED_NO_AUTO_RENEW}" == "true" ]]; then
            # Read the incoming state *before* seeding. The line printed afterwards cannot tell "the
            # flag came back from the secret" from "it was missing and this step just re-added it",
            # and whether the secret retains the flag is the one thing this input exists to
            # establish.
            if ARRIVED_WITHOUT=$(jq -r 'to_entries | map(select((.key|test("^[0-9]+$")) and (.value|type == "object") and ((.value.autoRenew|type) != "boolean")) | .key) | join(" ")' "$HOME/.silverfin/config.json"); then
              if [[ -n "${ARRIVED_WITHOUT}" ]]; then
                if [[ ${#ARRIVED_WITHOUT} -gt ${MAX_ERROR_LINE_LEN} ]]; then
                  ARRIVED_WITHOUT="${ARRIVED_WITHOUT:0:${MAX_ERROR_LINE_LEN}}... (truncated, see the job log)"
                fi
                # Expected once, on this repository's first seeded run. A recurrence is the real
                # signal: the write-back is not persisting the flag, and the pilot's no-renew
                # change would silently do nothing.
                echo "::warning::[Action] CONFIG_JSON arrived without a boolean autoRenew flag for firm(s): ${ARRIVED_WITHOUT} - seeding it now. Expected on the first seeded run for this repository; if it recurs, the secret is not retaining the flag."
              else
                echo "[Action] CONFIG_JSON arrived with an autoRenew flag for every object-shaped firm"
              fi
            else
              echo "::warning::[Action] could not read the incoming autoRenew state, continuing with the seed"
            fi
            if jq 'to_entries | map(if (.key|test("^[0-9]+$")) and (.value|type == "object") and ((.value.autoRenew|type) != "boolean") then .value.autoRenew = false else . end) | from_entries' \
                 "$HOME/.silverfin/config.json" > "$HOME/.silverfin/config.seeded.json" \
               && mv "$HOME/.silverfin/config.seeded.json" "$HOME/.silverfin/config.json"; then
              # Assigned rather than inlined into an echo: inside `echo "$(jq ...)"` a jq failure is
              # swallowed and prints an empty firm list as though nothing were wrong.
              if SEEDED_FLAGS=$(jq -r 'to_entries | map(select((.key|test("^[0-9]+$")) and (.value|type == "object")) | "\(.key)=\(.value.autoRenew)") | join(" ")' "$HOME/.silverfin/config.json"); then
                echo "[Action] autoRenew flag present for firm(s): ${SEEDED_FLAGS}"
              fi
              # The seeded ID set, not a boolean: the write-back needs to know *which* firms to
              # assert on, and an empty value there also means "seeding never ran" - that step is
              # `if: always()`, so it is reached even when this one aborts.
              # `&& [[ -n ... ]]`, not just the exit status: jq exits 0 and prints an empty string
              # when no numeric key holds an object (every firm record a scalar), and an empty value
              # here skips the write-back's assertion entirely - a green run that checked nothing,
              # which is the one outcome worse than failing.
              if SEEDED_FIRMS=$(jq -r 'to_entries | map(select((.key|test("^[0-9]+$")) and (.value|type == "object")) | .key) | join(" ")' "$HOME/.silverfin/config.json") \
                 && [[ -n "${SEEDED_FIRMS}" ]]; then
                echo "AUTO_RENEW_SEEDED_FIRMS=${SEEDED_FIRMS}" >> "$GITHUB_ENV"
              else
                echo "::warning::[Action] no firm was seeded with an autoRenew flag, so the round-trip is not asserted this run - check whether any firm record in CONFIG_JSON is a JSON object"
              fi
            else
              rm -f "$HOME/.silverfin/config.seeded.json"
              echo "::warning::[Action] could not seed the autoRenew flag, continuing with the refresh"
            fi
          fi
          FAILED_FIRMS=""
          FAILED_SUMMARY=""
          while IFS= read -r FIRM_ID; do
            echo "[Action] refreshing token for firm ${FIRM_ID}"
            if ! node ./node_modules/silverfin-cli/bin/cli.js config --refresh-token "${FIRM_ID}" 2>&1 | tee /tmp/refresh-"${FIRM_ID}".log; then
              # silverfin-cli's refreshFirm always ends an HTTP failure with a generic "try
              # running the authentication process again" line - tail -1 would report only that,
              # dropping the actual "Response Status: 401 (...)" / "Error description: ..." lines
              # printed just before it. Prefer those; fall back to the last non-empty line for any
              # other failure shape (e.g. a network error with no HTTP response at all).
              # `|| true` on both: under this shell's `-e`/`pipefail`, a `grep` with no match
              # exits 1 and that status survives the pipe into `paste`/`tail`, which would abort
              # the whole step right here on any non-HTTP failure (network error, DNS, etc.) -
              # before the fallback below ever runs, and before failed_firms/refresh_completed
              # are ever written. Confirmed empirically: `set -eo pipefail; X=$(grep nomatch f |
              # cmd)` exits the script without reaching the next line.
              ERROR_LINE=$(grep -E 'Response Status|Error description' /tmp/refresh-"${FIRM_ID}".log | paste -sd' ' - || true)
              if [[ -z "${ERROR_LINE}" ]]; then
                ERROR_LINE=$(grep -v '^[[:space:]]*$' /tmp/refresh-"${FIRM_ID}".log | tail -1 || true)
              fi
              if [[ ${#ERROR_LINE} -gt ${MAX_ERROR_LINE_LEN} ]]; then
                ERROR_LINE="${ERROR_LINE:0:${MAX_ERROR_LINE_LEN}}... (truncated, see the job log)"
              fi
              echo "::error::[Action] failed to refresh token for firm ${FIRM_ID}: ${ERROR_LINE}"
              FAILED_FIRMS="${FAILED_FIRMS:+${FAILED_FIRMS} }${FIRM_ID}"
              # A single line, not one per firm: $GITHUB_ENV/env: mappings in a caller workflow
              # can't reliably carry a raw embedded newline through, and downstream Slack alerts
              # want one line anyway.
              FAILED_SUMMARY="${FAILED_SUMMARY}${FAILED_SUMMARY:+; }firm ${FIRM_ID}: ${ERROR_LINE}"
            fi
            rm -f /tmp/refresh-"${FIRM_ID}".log
          done <<< "${FIRM_IDS}"
          if [[ ${#FAILED_SUMMARY} -gt ${MAX_SUMMARY_LEN} ]]; then
            FAILED_SUMMARY="${FAILED_SUMMARY:0:${MAX_SUMMARY_LEN}}... (truncated, see the job log for the rest)"
          fi
          # REFRESH_COMPLETED distinguishes "the loop ran and these firms failed" from "the step
          # aborted before writing anything", which would otherwise look identical downstream.
          {
            echo "REFRESH_FAILED_FIRMS=${FAILED_FIRMS}"
            echo "REFRESH_COMPLETED=true"
          } >> "$GITHUB_ENV"
          # Mirrored as step outputs (not just $GITHUB_ENV) so a caller of this reusable workflow
          # can name the failing firm in its own alert - env vars set here don't cross the
          # workflow_call boundary, only declared outputs do. refresh_completed is set here, at
          # the end of this step, so it is empty for every exit above (config not a single
          # object, no firms found) as well as for a zero-step startup_failure/cancellation - but
          # "true" whenever this loop itself finished, even if a later step (the CONFIG_JSON
          # write-back, or its own validation) is what ultimately fails the job. A caller must not
          # read empty failed_firms plus this being "true" as "the refresh step never ran".
          {
            echo "failed_firms=${FAILED_FIRMS}"
            echo "failed_firms_summary=${FAILED_SUMMARY}"
            echo "refresh_completed=true"
          } >> "$GITHUB_OUTPUT"
      # `always()`: keeps the renewals that succeeded when another firm failed. Because it also runs
      # when an earlier step failed, the config must be shape-checked first - an empty or truncated
      # file here would overwrite every firm's tokens.
      - name: Prepare and store updated CONFIG_JSON as secret
        id: write-back
        if: always()
        run: |
          if [[ -z "${EXPECTED_FIRM_IDS}" ]]; then
            echo "::error::[Action] refresh never ran, refusing to write CONFIG_JSON"
            exit 1
          fi
          FOUND_FIRM_IDS=$(jq -r 'del(.defaultFirmIDs, .host) | keys[] | select(test("^[0-9]+$"))' "$HOME/.silverfin/config.json" | tr '\n' ' ')
          for FIRM_ID in ${EXPECTED_FIRM_IDS}; do
            if [[ " ${FOUND_FIRM_IDS} " != *" ${FIRM_ID} "* ]]; then
              echo "::error::[Action] firm ${FIRM_ID} is missing from the config, refusing to write CONFIG_JSON"
              exit 1
            fi
          done
          # A dropped flag must never cost this run's renewals: the CLI has already rotated the
          # tokens server-side, so this file is the only copy of them. Record it, write anyway, and
          # let the last step go red - the same order that step's own comment describes.
          #
          # Gated on the seed having actually run, not on the input: this step is `if: always()`, so
          # an abort between the firm enumeration and the seed block would otherwise report an
          # unseeded config as a CLI regression. The set is every object-shaped firm present when
          # seeding ran; scalar records are excluded, since the seed leaves those alone and must
          # not fail the run over them.
          if [[ -n "${AUTO_RENEW_SEEDED_FIRMS}" ]]; then
            AUTO_RENEW_LOST=""
            for FIRM_ID in ${AUTO_RENEW_SEEDED_FIRMS}; do
              # A present-but-null autoRenew is a dropped flag too, so check the type rather than
              # `has`. `type == "object" and ...` short-circuits, which keeps a firm record the CLI
              # replaced with a scalar from turning this into a raw jq error.
              if ! jq -e --arg firm "${FIRM_ID}" '.[$firm] | type == "object" and (.autoRenew | type == "boolean")' "$HOME/.silverfin/config.json" > /dev/null 2>&1; then
                AUTO_RENEW_LOST="${AUTO_RENEW_LOST:+${AUTO_RENEW_LOST} }${FIRM_ID}"
              fi
            done
            if [[ -n "${AUTO_RENEW_LOST}" ]]; then
              # The full list is logged and exported; only the annotation is capped. Truncating the
              # exported value would cut mid-ID and break `auto_renew_lost`'s own contract of
              # space-separated firm IDs, and "see the job log" has to point at something - so the
              # log gets the untruncated list.
              echo "[Action] autoRenew flag not preserved for firm(s): ${AUTO_RENEW_LOST}"
              MAX_FIRM_LIST_LEN=200
              AUTO_RENEW_LOST_MSG="${AUTO_RENEW_LOST}"
              if [[ ${#AUTO_RENEW_LOST_MSG} -gt ${MAX_FIRM_LIST_LEN} ]]; then
                AUTO_RENEW_LOST_MSG="${AUTO_RENEW_LOST_MSG:0:${MAX_FIRM_LIST_LEN}}... (truncated, see the job log)"
              fi
              echo "::warning::[Action] autoRenew flag not preserved for firm(s): ${AUTO_RENEW_LOST_MSG} - still writing CONFIG_JSON to keep this run's renewals"
              echo "AUTO_RENEW_LOST=${AUTO_RENEW_LOST}" >> "$GITHUB_ENV"
            else
              echo "[Action] autoRenew flag survived the refresh for all firms"
            fi
          fi
          CONFIG_JSON=$(tr -d '\n' < "$HOME/.silverfin/config.json")
          echo "::add-mask::$CONFIG_JSON"
          # Retry on a transient GitHub API error (5xx) rather than losing this run's renewals
          # outright - a write failure here is otherwise indistinguishable from the refresh loop
          # itself failing, and forces the exact re-authorization dance R2 exists to avoid. A
          # permanent failure (bad token scope, rejected input) is never going to succeed on
          # retry, so it fails immediately instead of burning attempts and backoff on it.
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while true; do
            if ERR=$(echo "$CONFIG_JSON" | gh secret set CONFIG_JSON 2>&1); then
              break
            fi
            if ! grep -qE 'HTTP 5[0-9]{2}' <<< "${ERR}"; then
              echo "::error::[Action] failed to write CONFIG_JSON (non-transient failure): ${ERR}"
              exit 1
            fi
            if (( ATTEMPT >= MAX_ATTEMPTS )); then
              echo "::error::[Action] failed to write CONFIG_JSON after ${MAX_ATTEMPTS} attempts: ${ERR}"
              exit 1
            fi
            SLEEP=$(( 2 ** ATTEMPT ))
            echo "::warning::[Action] gh secret set CONFIG_JSON failed with a transient error (attempt ${ATTEMPT}/${MAX_ATTEMPTS}), retrying in ${SLEEP}s"
            sleep "${SLEEP}"
            ATTEMPT=$((ATTEMPT+1))
          done
          # Published only now, after the write actually succeeded. Set before the retry loop it
          # would survive a permanent write failure, and a caller reading it would announce "every
          # token refreshed and CONFIG_JSON was written" for the run that just lost its renewals.
          if [[ -n "${AUTO_RENEW_LOST}" ]]; then
            echo "auto_renew_lost=${AUTO_RENEW_LOST}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
      # Last, so an incomplete pass goes red without costing the write-back. A per-firm failure
      # means "not refreshed this pass", not necessarily a credential fault.
      - name: Fail if any firm was not refreshed
        if: always()
        run: |
          # Collected, not exited on in turn: these are independent failures, and exiting at the
          # first one hides the rest from a log that is the only record of what went wrong.
          FAILURES=""
          if [[ "${REFRESH_COMPLETED}" != "true" ]]; then
            echo "::error::[Action] the refresh step did not complete"
            FAILURES=1
          fi
          if [[ -n "${REFRESH_FAILED_FIRMS}" ]]; then
            echo "::error::[Action] token refresh incomplete for firm(s): ${REFRESH_FAILED_FIRMS}"
            FAILURES=1
          fi
          if [[ -n "${AUTO_RENEW_LOST}" ]]; then
            echo "::error::[Action] the CLI did not preserve the autoRenew flag for firm(s): ${AUTO_RENEW_LOST}"
            FAILURES=1
          fi
          if [[ -n "${FAILURES}" ]]; then
            exit 1
          fi
          echo "[Action] all firms refreshed"
