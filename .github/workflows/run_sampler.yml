# Reusable workflow. Runs the Liquid Sampler (silverfin-cli `run-sampler`) for a single
# partner's changed reconciliation/account templates and posts the result on a PR.
#
# This is deliberately partner-agnostic and repo-layout-agnostic: given a partner id, a list
# of already-classified handles/account templates, and firm ids, it loads that partner's
# credentials, runs the sampler, and reports back. All market-specific logic (which templates
# changed, which partner they belong to) lives in the calling wrapper — see
# docs/liquid_sampler.md and the CI_AUTH_SAMPLER_PLAN.md design notes (§6, §8) this implements.
#
# Design decisions this encodes (see plan §6 D1-D9, §8):
# - Serialized per partner: the backend allows only one sampler run per partner at a time.
#   `concurrency: { group, queue: max }` queues overlapping runs FIFO instead of cancelling —
#   cancelling the CI job does NOT cancel the backend run, it just orphans it and blocks the
#   partner until it clears.
# - Cross-repo collisions (two market repos sharing a partner id) can't be solved by GitHub
#   Actions concurrency groups (they don't span repos), so a 422 "already in progress" from the
#   backend is treated as the real mutex: poll-and-retry instead of failing immediately.
# - The partner api_key is a single rotate-on-401 credential stored in its own
#   PARTNER_CONFIG_JSON_<partner> secret (never the firm CONFIG_JSON). This workflow is the
#   sole writer of that secret, and only writes back if the on-disk token actually changed
#   during the run (diffed before/after, not inferred from log output).
# - `results.zip` is uploaded as a short-lived workflow artifact (7 days) for the rare
#   rendering-only regression the compact named_results diff can't see; the presigned report
#   URL is the long-lived source of truth.
name: run-liquid-sampler
run-name: "Liquid sampler · partner ${{ inputs.partner }}"

on:
  workflow_call:
    inputs:
      partner:
        description: "Partner environment id (must be authorized — see PARTNER_CONFIG_JSON secret)"
        required: true
        type: string
      handles:
        description: "Reconciliation text handles to sample, ONE PER LINE (directory names under reconciliation_texts/). Newline-separated, not space-separated — names may contain spaces. A name starting with '-' is rejected (the CLI would parse it as an option). Optional if account_templates is set."
        required: false
        type: string
        default: ""
      account_templates:
        description: "Account template names to sample, ONE PER LINE (directory names under account_templates/). Newline-separated, not space-separated — these names routinely contain spaces. A name starting with '-' is rejected (the CLI would parse it as an option). Optional if handles is set."
        required: false
        type: string
        default: ""
      firm_ids:
        description: "Firm id(s) to sample against, space-separated. The backend 422s if empty."
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA) to check out — the PR head, so sampled template content matches the PR under review."
        required: true
        type: string
      pull_request_number:
        description: "PR number to post the result comment on. If empty, no comment is posted (results still upload as an artifact)."
        required: false
        type: string
        default: ""
    secrets:
      SF_API_CLIENT_ID:
        description: "Silverfin API OAuth client id (silverfin-cli needs it at startup)."
        required: true
      SF_API_SECRET:
        description: "Silverfin API OAuth client secret."
        required: true
      SF_BASIC_AUTH:
        description: "HTTP Basic credentials (base64) for the staging gateway. The CLI only sends this when it auto-detects a *.staging.getsilverfin.com host; a no-op elsewhere."
        required: false
      PARTNER_CONFIG_JSON:
        description: "This partner's stored credentials (host + partnerCredentials.<partner>.token). Caller resolves the per-partner secret, e.g. secrets[format('PARTNER_CONFIG_JSON_{0}', matrix.partner)]."
        required: true
      REPO_ACCESS_TOKEN:
        description: "PAT with repo scope, used to write the rotated partner token back via `gh secret set`."
        required: true

permissions:
  contents: read
  pull-requests: write

# Lives inside the reusable workflow itself (not the wrapper) so every adopter gets the
# serialization for free with no way to forget it. `github.repository` here resolves to the
# CALLER's repo (GitHub Actions behavior for reusable workflows), so two different market repos
# each get their own group — see the cross-repo mitigation below for why that's not sufficient
# on its own.
concurrency:
  group: sampler-${{ github.repository }}-${{ inputs.partner }}
  # 'queue: max' is a GitHub Actions beta sub-key (FIFO, nothing cancelled). If a target repo's
  # plan rejects it, fall back to `queue: single` or plain `cancel-in-progress: false` — never
  # cancel-in-progress: true, since cancelling this job does not cancel the backend run.
  queue: max

jobs:
  run-sampler:
    runs-on: ubuntu-latest
    # Generous ceiling: a single run is ~30-60 min, plus up to ~90 min of poll-and-retry on a
    # cross-repo 422 collision (see the retry loop below).
    timeout-minutes: 180
    # Job-level (not just on the sampler step): the CLI checks for these at process startup for
    # every command, including a bare `-V` version probe - confirmed live (the "Install
    # silverfin-cli" step failed with "Missing API credentials" before these were job-scoped).
    env:
      SF_API_CLIENT_ID: ${{ secrets.SF_API_CLIENT_ID }}
      SF_API_SECRET: ${{ secrets.SF_API_SECRET }}
    steps:
      - name: Validate inputs
        env:
          HANDLES: ${{ inputs.handles }}
          ACCOUNT_TEMPLATES: ${{ inputs.account_templates }}
          FIRM_IDS: ${{ inputs.firm_ids }}
        run: |
          if [[ -z "${HANDLES//[[:space:]]/}" && -z "${ACCOUNT_TEMPLATES//[[:space:]]/}" ]]; then
            echo "::error::Neither handles nor account_templates was supplied — nothing to sample."
            exit 1
          fi
          if [[ -z "${FIRM_IDS//[[:space:]]/}" ]]; then
            echo "::error::firm_ids is empty. The sampler backend 422s without firm ids."
            exit 1
          fi

      - name: Checkout repository at PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install silverfin-cli
        run: |
          # Pinned to a commit on silverfin-cli's sampler-compact-diff-v2 branch, since
          # --compact/--from-zip/--add-diffs-folder (used below) are not yet on main. Switch back
          # to installing unpinned main, matching every other production workflow's convention,
          # once that branch's PR (silverfin-cli#265) merges.
          #
          # Re-pin to the branch tip whenever that branch gains fixes — a commit pin silently goes
          # stale, and a rebase can orphan it entirely. The previous pin (5accd6b) was exactly
          # that: a pre-rebase copy of "Make --add-diffs-folder's zip write atomic", no longer an
          # ancestor of the branch, and missing five later fixes to the compact diff (flag-array
          # flip direction, radio-checked attribute boundary, flag-flip suffix side, the
          # no-view.html rewrite skip, and the identical-render diffs/ skip).
          npm install https://github.com/silverfin/silverfin-cli.git#1ba5a0f
          VERSION=$(node ./node_modules/silverfin-cli/bin/cli.js -V)
          echo "CLI version: ${VERSION}"

      - name: Load PARTNER_CONFIG_JSON (host + partnerCredentials)
        env:
          PARTNER_CONFIG_JSON: ${{ secrets.PARTNER_CONFIG_JSON }}
          PARTNER: ${{ inputs.partner }}
        run: |
          echo "::add-mask::${PARTNER_CONFIG_JSON}"
          mkdir -p "$HOME/.silverfin"
          printf '%s' "${PARTNER_CONFIG_JSON}" > "$HOME/.silverfin/config.json"
          if ! jq -e --arg p "${PARTNER}" '(.partnerCredentials[$p].token | type == "string" and length > 0)' "$HOME/.silverfin/config.json" > /dev/null 2>&1; then
            echo "::error::PARTNER_CONFIG_JSON has no partnerCredentials entry for partner ${PARTNER}. Authorize it first with 'silverfin authorize-partner -i ${PARTNER} -k <api-key>' and store the resulting config.json as this secret."
            exit 1
          fi
          echo "Host: $(jq -r '.host // "(default)"' "$HOME/.silverfin/config.json")"

      - name: Capture partner token before the run
        id: before
        env:
          PARTNER: ${{ inputs.partner }}
        run: |
          TOKEN=$(jq -r --arg p "${PARTNER}" '.partnerCredentials[$p].token' "$HOME/.silverfin/config.json")
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Run liquid sampler (retries on a cross-repo 422 collision)
        id: sampler
        env:
          SF_BASIC_AUTH: ${{ secrets.SF_BASIC_AUTH }}
          SAMPLER_PARTNER: ${{ inputs.partner }}
          SAMPLER_HANDLES: ${{ inputs.handles }}
          SAMPLER_ACCOUNT_TEMPLATES: ${{ inputs.account_templates }}
          SAMPLER_FIRM_IDS: ${{ inputs.firm_ids }}
        run: |
          # One name per line, and each line becomes exactly ONE CLI arg. Newline-separated (not
          # space-separated) keeps identifiers that contain spaces intact — account template
          # names do (e.g. "Investment- and depreciation details"), and word-splitting them
          # handed the CLI "Investment-" as a template name:
          #   [error] Config file for account template "Investment-" not found
          # Same convention as run_tests.yml's TEMPLATE_BUCKETS.
          HANDLE_NAMES=()
          ACCOUNT_NAMES=()
          if [[ -n "${SAMPLER_HANDLES//[[:space:]]/}" ]]; then
            mapfile -t HANDLE_NAMES < <(printf '%s\n' "${SAMPLER_HANDLES}" | sed '/^[[:space:]]*$/d')
          fi
          if [[ -n "${SAMPLER_ACCOUNT_TEMPLATES//[[:space:]]/}" ]]; then
            mapfile -t ACCOUNT_NAMES < <(printf '%s\n' "${SAMPLER_ACCOUNT_TEMPLATES}" | sed '/^[[:space:]]*$/d')
          fi

          # A name starting with "-" would be read by the CLI's option parser as a FLAG rather
          # than a value: commander stops consuming a variadic option (-h/-at take <names...>) at
          # the first "-"-prefixed token, and a leading "--" separator does not protect variadic
          # values either. Reject such a name up front instead of letting the CLI silently
          # reinterpret it as an option. Both lists are checked, so the message names which kind
          # of value and which directory to rename.
          reject_option_like_names() {
            local kind="$1" dir="$2"
            shift 2
            local name
            for name in "$@"; do
              if [[ "${name}" == -* ]]; then
                echo "::error::${kind} '${name}' starts with '-', which silverfin-cli would parse as an option instead of a value. Rename the ${dir} directory."
                exit 1
              fi
            done
          }
          reject_option_like_names "Reconciliation handle" "reconciliation_texts/" "${HANDLE_NAMES[@]}"
          reject_option_like_names "Account template name" "account_templates/" "${ACCOUNT_NAMES[@]}"

          HANDLE_ARGS=()
          if [[ ${#HANDLE_NAMES[@]} -gt 0 ]]; then
            HANDLE_ARGS=(-h "${HANDLE_NAMES[@]}")
          fi
          ACCOUNT_ARGS=()
          if [[ ${#ACCOUNT_NAMES[@]} -gt 0 ]]; then
            ACCOUNT_ARGS=(-at "${ACCOUNT_NAMES[@]}")
          fi

          # GitHub Actions concurrency (group + queue: max) serializes runs within THIS repo, but
          # concurrency groups do not span repositories — two market repos sharing this partner id
          # can still collide. The backend's own one-run-per-partner 422 is the real cross-repo
          # mutex, so treat it as a "try again shortly" signal, not a hard failure. Bounded to
          # match the worst-case run length (~60 min) plus margin.
          DEADLINE=$(( $(date +%s) + 90*60 ))
          # Separate, harder bound. The job is capped by `timeout-minutes`, and a cancellation at
          # that cap kills the `if: always()` write-back, artifact and PR-comment steps outright -
          # so the rotated partner token would be lost and nothing would be reported. Everything
          # below must finish with enough margin left for those steps to run.
          STEP_DEADLINE=$(( $(date +%s) + 160*60 ))
          ATTEMPT=1
          while true; do
            # %q-quoted so a name containing spaces is visibly one argument in the log.
            printf '[%s] run-sampler attempt %s: -p %s' "$(date -u +%H:%M:%S)" "${ATTEMPT}" "${SAMPLER_PARTNER}"
            printf ' %q' "${HANDLE_ARGS[@]}" "${ACCOUNT_ARGS[@]}"
            printf ' --firm-ids %s --compact\n' "${SAMPLER_FIRM_IDS}"
            set +e
            # shellcheck disable=SC2086 # SAMPLER_FIRM_IDS is intentionally word-split (space-separated ids -> separate args)
            # Not piped into `tr` here: this step has no explicit `shell: bash`, so it runs as
            # `bash -e {0}` with no pipefail, and `$?` after a pipeline is the LAST command's
            # status - `tr`'s, which is always 0. That silently kills every RC-gated branch
            # below, the stale-auth re-dispatch included. Strip the CRs after capturing.
            OUTPUT=$(node ./node_modules/silverfin-cli/bin/cli.js run-sampler -p "${SAMPLER_PARTNER}" "${HANDLE_ARGS[@]}" "${ACCOUNT_ARGS[@]}" --firm-ids ${SAMPLER_FIRM_IDS} --compact 2>&1)
            RC=$?
            set -e
            OUTPUT=$(tr -d '\r' <<< "${OUTPUT}")
            # head, not tail: the CLI prints this line exactly once, before it renders anything,
            # so the first match is its own. Taking the last would let sampled template content
            # spoof the id.
            SAMPLER_ID=$(printf '%s\n' "${OUTPUT}" | sed -n 's/.*Sampler run started with ID: \([0-9][0-9]*\).*/\1/p' | head -n 1)
            REATTACHED=false
            echo "----- run-sampler output (exit ${RC}) -----"
            echo "$OUTPUT"
            echo "--------------------------------------------"

            # The CLI stops polling long before the backend stops running, and abandoning the run
            # here costs the whole result: the next attempt then collides with the still-running
            # original on the one-run-per-partner 422. Re-attach to it instead.
            #
            # Matched on the CLI's own timeout sentence, not on ${RC}: $? above is `tr`'s status,
            # not node's, so an exit-code gate would never fire. The full sentence is specific
            # enough that a sampled template's rendered content can't trip it.
            #
            # `--id` is a single status read, not a poll, and the CLI only times out while the run
            # is still going — so one read would always come back "still in progress". Keep
            # re-reading on its own budget (the loop's DEADLINE is long gone by now).
            if printf '%s' "${OUTPUT}" | grep -qF 'Timeout. Try to fetch the status by using the --id flag'; then
              if [[ -z "${SAMPLER_ID}" ]]; then
                # Without an id there is nothing to re-attach to, and the run keeps going
                # server-side regardless - say so, or the next attempt's 422 looks unexplained.
                echo "::error::Polling timed out but no sampler run id could be parsed from the output, so this run cannot be re-attached to. It is still running for partner ${SAMPLER_PARTNER} and will 422 the next attempt."
              else
                echo "::notice::Polling timed out; re-attaching to sampler run ${SAMPLER_ID} rather than starting a new one."
                REATTACHED=true
                REATTACH_DEADLINE=$(( $(date +%s) + 30*60 ))
                if (( REATTACH_DEADLINE > STEP_DEADLINE )); then REATTACH_DEADLINE=${STEP_DEADLINE}; fi
                while true; do
                  set +e
                  # Not piped into `tr` here, so ${RC} is node's own status; stripped afterwards.
                  OUTPUT=$(node ./node_modules/silverfin-cli/bin/cli.js run-sampler -p "${SAMPLER_PARTNER}" --id "${SAMPLER_ID}" --compact 2>&1)
                  RC=$?
                  set -e
                  OUTPUT=$(tr -d '\r' <<< "${OUTPUT}")
                  echo "----- run-sampler --id output (exit ${RC}) -----"
                  echo "$OUTPUT"
                  echo "-----------------------------------------------"
                  # Break only on a verdict the backend actually reached. Matched on the CLI's own
                  # sentences rather than on ${RC}, because it exits 1 for two very different
                  # things: a run that failed, and a status read that failed. Treating the latter
                  # as terminal - which "anything that isn't still-in-progress" does - abandons a
                  # live run on one network blip, which is the exact collision this block exists
                  # to prevent.
                  if printf '%s' "${OUTPUT}" | grep -qF \
                       -e 'Sampler run completed successfully' \
                       -e 'Sampler run failed:' \
                       -e 'Sampler completed but no result URL was returned' \
                       -e 'Unexpected sampler status:'; then
                    break
                  fi
                  if (( $(date +%s) >= REATTACH_DEADLINE )); then
                    if printf '%s' "${OUTPUT}" | grep -qF 'Sampler run is still in progress'; then
                      echo "::error::Sampler run ${SAMPLER_ID} was still running at the re-attach deadline. The backend run is NOT cancelled and will 422 the next attempt; re-read it with: run-sampler -p ${SAMPLER_PARTNER} --id ${SAMPLER_ID} --compact"
                    else
                      echo "::error::Could not read the status of sampler run ${SAMPLER_ID} before the re-attach deadline (last exit ${RC}). The backend run is NOT cancelled."
                    fi
                    # A still-in-progress read exits 0; don't let that read as success.
                    RC=1
                    break
                  fi
                  sleep 60
                done
              fi
            fi

            # Skipped after a re-attach: OUTPUT then holds a status read for the run this job is
            # deliberately attached to, including (once it completes) the rendered compact diff.
            # Matching that as a collision would start a brand-new run against the one just waited
            # for.
            if [[ "${REATTACHED}" != "true" ]] && echo "$OUTPUT" | grep -qi "already in progress"; then
              NOW=$(date +%s)
              if (( NOW >= DEADLINE )); then
                # Don't exit here: fall through to the normal output-setting logic below (which
                # will correctly record sampler_ok=false / no report_url) so downstream steps
                # (write-back, PR comment) still run via their own `if:` conditions instead of
                # being skipped by a hard step failure. The final "Fail job" step still fails
                # the job overall.
                echo "::error::Partner ${SAMPLER_PARTNER} still has a sampler run in progress after 90 minutes of retrying. Giving up — check whether a previous run is stuck (§2.3/2.4c: no CLI cancel exists for a backend run)."
                break
              fi
              echo "[$(date -u +%H:%M:%S)] partner ${SAMPLER_PARTNER} has a run in progress elsewhere (cross-repo or stale) — retrying in 60s..."
              sleep 60
              ATTEMPT=$((ATTEMPT+1))
              continue
            fi
            break
          done

          {
            echo "rc=${RC}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${RC}" -ne 0 ]]; then
            echo "sampler_ok=false" >> "$GITHUB_OUTPUT"
          elif echo "$OUTPUT" | grep -qi "completed successfully"; then
            echo "sampler_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "sampler_ok=false" >> "$GITHUB_OUTPUT"
          fi

          # A stale partner credential, told apart from every other failure.
          #
          # `secrets.*` is snapshotted when the RUN is created, not when the job starts, so a
          # run that was queued while a sibling run refreshed this partner's token is holding a
          # credential that has since been spent - refresh_api_key consumes the old key to mint
          # the new one, so there is exactly one live value at a time. The CLI then fails its
          # own refresh with a 401, which is what this matches.
          #
          # Nothing in-run can fix it: the snapshot is fixed for the job's lifetime and GitHub
          # secrets cannot be read back through the API. Only a NEW run gets a fresh snapshot,
          # which is what the re-dispatch step below is for.
          if [[ "${RC}" -ne 0 ]] && echo "$OUTPUT" | grep -qF 'Error refreshing credentials'; then
            echo "stale_auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale_auth=false" >> "$GITHUB_OUTPUT"
          fi

          # Report URL: "Sampler report: https://..." (strip ANSI first).
          # `|| true`: under `set -eo pipefail`, grep finding no match (a failed/timed-out run
          # never prints this line) makes the whole pipeline's exit status non-zero even though
          # head/sed after it succeed on empty input - that would abort this step here, before
          # the compact-diff extraction below and before the "always run" downstream steps ever
          # see a value, silently dropping the PR comment on failure. Confirmed by reproducing
          # locally: without `|| true` this line aborted the step on every non-completed run.
          REPORT_URL=$(echo "$OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' | grep -oE 'Sampler report: https?://[^[:space:]]+' | head -n1 | sed 's/^Sampler report: //') || true
          echo "report_url=${REPORT_URL}" >> "$GITHUB_OUTPUT"

          # Compact named_results diff, between the CLI's own markers.
          COMPACT=$(echo "$OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' | awk '/SAMPLER_COMPACT_START/{f=1;next} /SAMPLER_COMPACT_END/{f=0} f')
          {
            echo "compact<<SAMPLER_COMPACT_EOF_9c2a"
            echo "$COMPACT"
            echo "SAMPLER_COMPACT_EOF_9c2a"
          } >> "$GITHUB_OUTPUT"

      - name: Capture partner token after the run and write back if rotated
        id: after
        # Gated on steps.before succeeding, not just always(): if "Load"/"Capture...before" never
        # got a valid token for this partner (e.g. the secret is missing a partnerCredentials
        # entry), steps.before.outputs.token is empty - comparing that against whatever
        # AFTER_TOKEN happens to parse to would read as "rotated" and write back a config that
        # was never actually valid to begin with. Caught live: a run that failed at "Load"
        # (invalid secret content) still had this step fire under bare always() and wrote the
        # same bad content back to the secret - a no-op here, but the wrong behavior in general.
        if: always() && steps.before.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          PARTNER: ${{ inputs.partner }}
          BEFORE_TOKEN: ${{ steps.before.outputs.token }}
        run: |
          if [[ ! -f "$HOME/.silverfin/config.json" ]]; then
            echo "No config.json on disk (load step must have failed) — nothing to write back."
            exit 0
          fi
          AFTER_TOKEN=$(jq -r --arg p "${PARTNER}" '.partnerCredentials[$p].token' "$HOME/.silverfin/config.json")
          echo "::add-mask::${AFTER_TOKEN}"
          if ! jq -e --arg p "${PARTNER}" '(.partnerCredentials[$p].token | type == "string" and length > 0)' "$HOME/.silverfin/config.json" > /dev/null 2>&1; then
            echo "::error::Partner ${PARTNER} config.json has no valid token after the run — refusing to write back a possibly broken config."
            exit 1
          fi
          if [[ "${AFTER_TOKEN}" == "${BEFORE_TOKEN}" ]]; then
            echo "Partner token unchanged — no write-back needed (sole-writer secret stays untouched)."
            exit 0
          fi
          echo "Partner token rotated mid-run (401 refresh) — writing PARTNER_CONFIG_JSON_${PARTNER} back."
          CONFIG_JSON=$(cat "$HOME/.silverfin/config.json" | tr -d '\n')
          echo "::add-mask::${CONFIG_JSON}"
          echo "$CONFIG_JSON" | gh secret set "PARTNER_CONFIG_JSON_${PARTNER}"

      - name: Download results.zip for the workflow artifact
        id: download
        if: always() && steps.sampler.outputs.report_url != ''
        env:
          REPORT_URL: ${{ steps.sampler.outputs.report_url }}
        run: |
          # The CLI's --compact path downloads to a temp dir and deletes it after printing the
          # diff, so results.zip never lands on disk on its own — fetch it again here for the
          # artifact (Q12: full zip kept for rendering-only regressions the compact diff can't see).
          # Note: the presigned REPORT_URL itself is short-lived (measured at ~5 minutes past
          # run completion, not the long-lived link it was originally assumed to be — see
          # silverfin-cli's CI_AUTH_SAMPLER_PLAN.md §10.4). A failure here means the human-facing
          # PR comment link below falls back to that presigned URL, which may already be dead.
          if curl -sL --fail --max-time 300 -o results.zip "${REPORT_URL}"; then
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not download results.zip from the report URL for the artifact upload."
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add diffs/ folder for the entries the compact diff flagged
        id: add_diffs
        # Pure local re-analysis of the zip already on disk - no network call, no partner API
        # (silverfin-cli's --from-zip path). Best-effort: a failure here shouldn't cost the
        # reviewer the plain results.zip artifact they'd otherwise get.
        if: always() && steps.download.outputs.downloaded == 'true'
        continue-on-error: true
        run: |
          if node ./node_modules/silverfin-cli/bin/cli.js run-sampler --from-zip results.zip --add-diffs-folder; then
            echo "diffs_added=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Failed to add diffs/ folder to results.zip — the uploaded artifact is the plain sampler output for this run."
            echo "diffs_added=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload results.zip artifact
        id: upload
        if: always() && steps.download.outputs.downloaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sampler-results-partner-${{ inputs.partner }}
          path: results.zip
          retention-days: 7
          # STORE, not DEFLATE: the action re-zips whatever it uploads, and results.zip is already
          # per-file deflated. Compressing it again saves ~nothing and makes the outer entry one
          # DEFLATE stream spanning the whole file, so the inner zip's central directory is
          # unreachable by Range request and a consumer must download all 20+ MB for a few files.
          compression-level: 0

      - name: Post result comment on the PR
        if: always() && inputs.pull_request_number != ''
        uses: actions/github-script@v8
        env:
          PARTNER: ${{ inputs.partner }}
          HANDLES: ${{ inputs.handles }}
          ACCOUNT_TEMPLATES: ${{ inputs.account_templates }}
          FIRM_IDS: ${{ inputs.firm_ids }}
          SAMPLER_OK: ${{ steps.sampler.outputs.sampler_ok }}
          REPORT_URL: ${{ steps.sampler.outputs.report_url }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DIFFS_ADDED: ${{ steps.add_diffs.outputs.diffs_added }}
          COMPACT: ${{ steps.sampler.outputs.compact }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          SAMPLED_REF: ${{ inputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # github.* here resolves to the CALLER's workflow run, which is exactly the provenance a
          # consumer needs: the repo, run and event the sampled diff actually came from.
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const marker = `<!-- silverfin-sampler-result-${process.env.PARTNER} -->`;
            const ok = process.env.SAMPLER_OK === "true";
            const reportUrl = process.env.REPORT_URL || "";
            // The backend's presigned reportUrl expires ~5 minutes after the run completes
            // (CI_AUTH_SAMPLER_PLAN.md §10.4) — by the time a human reads this comment it's
            // always dead. Prefer the GitHub Actions artifact link, which stays valid for the
            // full 7-day retention window; fall back to the presigned URL only if the artifact
            // upload itself didn't happen (e.g. the post-run download failed).
            const artifactUrl = process.env.ARTIFACT_URL || "";
            const diffsAdded = process.env.DIFFS_ADDED || "";
            const compact = (process.env.COMPACT || "").trim();
            const runUrl = process.env.RUN_URL;

            const lines = [`## Liquid sampler · partner \`${process.env.PARTNER}\``, ""];
            if (ok) {
              lines.push("This is a **review artifact, not a pass/fail gate** — check the diff below (or the full report) for unintended changes.");
            } else {
              lines.push(`⚠️ The sampler run did not complete cleanly — see the [workflow run](${runUrl}) for details.`);
            }
            lines.push("");
            // Newline-separated on the way in (names can contain spaces) — render one code-quoted
            // name per entry, comma-separated. A multi-line value inside one backtick pair
            // renders as garbage in a PR comment.
            //
            // These names are directory names from the PR's own tree, so treat them as untrusted
            // text: a name containing a backtick would otherwise close its code span and inject
            // markdown into this comment. Per CommonMark, fence with one more backtick than the
            // longest run inside the name, and pad when it starts/ends with a backtick.
            const codeSpan = (s) => {
              const longest = Math.max(0, ...[...s.matchAll(/`+/g)].map((m) => m[0].length));
              const fence = "`".repeat(longest + 1);
              const pad = s.startsWith("`") || s.endsWith("`") ? " " : "";
              return `${fence}${pad}${s}${pad}${fence}`;
            };
            // A code span only changes how text RENDERS; the raw characters stay in the body, and
            // both the update-in-place lookup and any provenance consumer read the raw body. So a
            // directory named `<!-- silverfin-sampler-result-9 -->` would plant another partner's
            // marker in this comment and let their next run overwrite it. U+2011 renders as a
            // hyphen but cannot delimit an HTML comment.
            const neutraliseComments = (s) => s.replace(/<!--/g, "<!‑‑").replace(/--!?>/g, "‑‑>");
            const fmtNames = v => (v || "").split("\n").map(s => s.trim()).filter(Boolean).map(codeSpan).map(neutraliseComments).join(", ");
            if (process.env.HANDLES) lines.push(`- Reconciliation handles: ${fmtNames(process.env.HANDLES)}`);
            if (process.env.ACCOUNT_TEMPLATES) lines.push(`- Account templates: ${fmtNames(process.env.ACCOUNT_TEMPLATES)}`);
            lines.push(`- Firm(s): \`${process.env.FIRM_IDS}\``);
            if (artifactUrl) {
              lines.push(`- **[📊 Open full sampler report](${artifactUrl})** (GitHub sign-in required; downloads \`results.zip\`, kept 7 days)`);
              if (diffsAdded === "false") {
                lines.push(`  - ⚠️ Could not add the \`diffs/\` folder to this artifact — see the [workflow run](${runUrl}) logs. The plain \`results.zip\` is still there.`);
              }
            } else if (reportUrl) {
              lines.push(`- **[📊 Open full sampler report](${reportUrl})** (downloads \`results.zip\` — this direct link expires ~5 minutes after the run, may already be gone)`);
            } else {
              lines.push(`- ⚠️ No sampler report link available for this run — see the [workflow run](${runUrl}) logs.`);
            }
            lines.push(`- Workflow run: ${runUrl}`);
            lines.push("");
            if (compact) {
              // Rendered output of PR-controlled templates, so it can contain anything - including
              // a literal copy of one of the HTML-comment markers below. A forged provenance block
              // would sit ABOVE the real one and win for any consumer taking the first match, and a
              // forged result marker would redirect the update-in-place lookup to another comment.
              // Escaping the real block does nothing about a forged one, so neutralise the comment
              // delimiters at the source. U+2011 renders as a hyphen but cannot open or close an
              // HTML comment.
              lines.push(neutraliseComments(compact));
            } else if (ok) {
              lines.push("_No compact diff was produced (see the run log)._");
            }
            // Machine-readable origin data, invisible to human readers. Without it a consumer has
            // to scrape the artifact id out of a markdown link and has nothing at all stating
            // which PR/run produced this diff — an agent that guesses from branch resemblance
            // reports confidently on the wrong PR. JSON, so the shape can grow without reparsing.
            const provenance = {
              schema: 1,
              repository: process.env.REPOSITORY,
              // Numbers, not strings: these are compared against the Actions API's own numeric ids.
              run_id: Number(process.env.RUN_ID),
              run_attempt: Number(process.env.RUN_ATTEMPT),
              event_name: process.env.EVENT_NAME,
              workflow_dispatch: process.env.EVENT_NAME === "workflow_dispatch",
              partner: process.env.PARTNER,
              pr_number: process.env.PR_NUMBER ? Number(process.env.PR_NUMBER) : null,
              // The ref the sampled templates were read from. Named `ref`, not `head_sha`: the
              // input accepts any git ref, and callers are the ones promising it is a PR head SHA.
              ref: process.env.SAMPLED_REF || null,
              artifact_id: process.env.ARTIFACT_ID ? Number(process.env.ARTIFACT_ID) : null,
              sampler_ok: ok,
            };
            // Escape every "--" so no value (a branch name, a template name) can close the HTML
            // comment early; the escaped form parses back to a plain hyphen, so nothing is lost.
            const provenanceComment = `<!-- silverfin-sampler-provenance ${JSON.stringify(provenance).replace(/--/g, "\\u002d\\u002d")} -->`;
            lines.push("", provenanceComment, marker);
            const body = lines.join("\n");

            const { owner, repo } = context.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.find(c => c.user && c.user.type === "Bot" && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

      - name: Re-dispatch once if the partner credential was stale
        id: autoretry
        # Needs the PR number for both the re-dispatch input and the loop guard; without one
        # there is nothing to key the guard on, so fail normally instead of risking a loop.
        if: always() && steps.sampler.outputs.stale_auth == 'true' && inputs.pull_request_number != ''
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PARTNER: ${{ inputs.partner }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          # Resolves to the CALLER's top-level workflow, e.g.
          # silverfin/be_market/.github/workflows/run_sampler.yml@refs/heads/main
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          # Needs a token that can dispatch a workflow; the default GITHUB_TOKEN cannot.
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const partner = process.env.PARTNER;
            // One marker per partner per PR: a second stale-auth failure for the same pair has
            // a cause this retry cannot fix, and retrying it forever would pin the partner.
            const marker = `<!-- silverfin-sampler-autoretry-${partner} -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            if (comments.some((c) => c.body && c.body.includes(marker))) {
              core.warning(`Already auto-retried partner ${partner} on this PR once; not retrying again.`);
              core.setOutput("retried", "false");
              return;
            }

            // "owner/repo/.github/workflows/<file>@<ref>" -> "<file>" and "<ref>".
            const ref = process.env.WORKFLOW_REF.split("@").slice(1).join("@");
            const workflowFile = process.env.WORKFLOW_REF.split("@")[0].split("/.github/workflows/")[1];
            if (!workflowFile || !ref) {
              core.warning(`Could not parse a workflow file and ref from '${process.env.WORKFLOW_REF}' - not retrying.`);
              core.setOutput("retried", "false");
              return;
            }

            // Checked BEFORE the marker is written, not after: createWorkflowDispatch only accepts
            // a branch or a tag, and a caller triggered by `pull_request` resolves to
            // `refs/pull/<n>/merge`, which 422s. Since the marker is deliberately written first
            // (see below), discovering that afterwards would spend this PR's one retry on a
            // dispatch that never happened - and `continue-on-error` would hide it.
            if (ref.startsWith("refs/") && !/^refs\/(heads|tags)\//.test(ref)) {
              core.warning(`Caller ref '${ref}' is neither a branch nor a tag, so it cannot be dispatched (a pull_request-triggered caller resolves to refs/pull/<n>/merge). Not retrying; re-run this workflow manually.`);
              core.setOutput("retried", "false");
              return;
            }

            // Marker first: if the dispatch succeeds but this write then fails, the next stale
            // failure would retry again. Writing first can only ever under-retry, never loop.
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: [
                `### ♻️ Sampler auto-retry · partner \`${partner}\``,
                "",
                "The previous run held a partner credential that another run had already spent, so it",
                `could not authenticate ([run](${process.env.RUN_URL})). GitHub snapshots secrets when a run is *created*, so a`,
                "queued run cannot see a token refreshed after it was queued - only a new run can.",
                "",
                "Re-dispatching once. This comment is also the loop guard: no further automatic retry",
                "will fire for this partner on this PR.",
                "",
                marker,
              ].join("\n"),
            });

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflowFile, ref,
              inputs: { pull_request_number: String(prNumber) },
            });
            core.notice(`Re-dispatched ${workflowFile} on ${ref} for PR #${prNumber} (partner ${partner}).`);
            core.setOutput("retried", "true");

      - name: Fail job if the sampler run did not complete successfully
        if: always() && steps.sampler.outputs.sampler_ok != 'true'
        env:
          PARTNER: ${{ inputs.partner }}
          STALE_AUTH: ${{ steps.sampler.outputs.stale_auth }}
          RETRIED: ${{ steps.autoretry.outputs.retried }}
        run: |
          if [[ "${STALE_AUTH}" == "true" ]]; then
            # Reports what actually happened rather than what was attempted: the re-dispatch is
            # `continue-on-error`, and it declines outright on a non-dispatchable caller ref.
            if [[ "${RETRIED}" == "true" ]]; then
              echo "::error::Partner ${PARTNER}'s stored credential was already spent by another run, so this run could not authenticate. This job still fails (its results are gone), but a fresh run has been dispatched — see the auto-retry comment."
            else
              echo "::error::Partner ${PARTNER}'s stored credential was already spent by another run, so this run could not authenticate. No automatic retry was dispatched (already retried once on this PR, no PR number, a caller ref that cannot be dispatched, or the dispatch itself failed) — re-run this workflow manually."
            fi
          else
            echo "::error::Sampler run for partner ${PARTNER} did not complete successfully — see the run-sampler step output above."
          fi
          exit 1
