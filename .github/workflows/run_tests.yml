name: run-liquid-tests
run-name: Run liquid tests of updated reconciliations and reconciliations that use updated shared parts
on:
  workflow_call:

  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "main"

jobs:
  check-auth:
    uses: ./.github/workflows/check_auth.yml
    secrets: inherit

  check-changed-templates:
    runs-on: ubuntu-latest
    outputs:
      changed_templates: ${{ steps.templates_changed.outputs.changed_templates }}
    steps:
      - name: Checkout Repository - Fetch all history for all tags and branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed liquid files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          since_last_remote_commit: false
          dir_names: false
          ref: "main"
          files: |
            **/**.{liquid,yml,yaml,json}
      - name: Filter templates changed
        id: templates_changed
        run: |
          pattern="(?:reconciliation_texts|shared_parts|account_templates)/([^/]+)/"
          changed_files="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -n "$changed_files" ]; then
            filtered_names=($(printf "%s\n" "$changed_files" | grep -oP "$pattern" || true))
            if [ $? -ne 0 ]; then
              echo "No files match the pattern"
              changed_templates=()
            else
              # Remove the trailing "/" from the extracted names
              filtered_names=("${filtered_names[@]%/}")
              # Remove duplicates
              changed_templates=($(printf "%s\n" "${filtered_names[@]}" | sort -u))
            fi
          else
            echo "No changed files"
            changed_templates=()
          fi
          # Store outputs
          if [ ${#changed_templates[@]} -eq 0 ]; then
            echo "changed_templates=[]" >> $GITHUB_OUTPUT
          else
            echo "changed_templates=${changed_templates[*]}" >> $GITHUB_OUTPUT
            # Print the templates names
            for name in "${changed_templates[@]}"; do
              echo "$name"
            done
          fi
          exit 0

  test-templates:
    runs-on: ubuntu-latest
    env:
      SF_API_CLIENT_ID: "${{ secrets.SF_API_CLIENT_ID }}"
      SF_API_SECRET: "${{ secrets.SF_API_SECRET }}"
      SF_TEST_FIRM_ID: "${{ vars.SF_TEST_FIRM_ID }}"
      CHANGED_TEMPLATES: "${{ needs.check-changed-templates.outputs.changed_templates }}"
    if: ${{ needs.check-changed-templates.outputs.changed_templates != '[]' }}
    needs: [check-auth, check-changed-templates]
    steps:
      - name: Checkout Repository - Fetch all history for all tags and branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load Silverfin config file from secrets
        run: |
          mkdir -p $HOME/.silverfin/
          touch $HOME/.silverfin/config.json
          echo '${{ secrets.CONFIG_JSON }}' > $HOME/.silverfin/config.json
      - name: Add silverfin-cli package latest version
        run: |
          npm install https://github.com/silverfin/silverfin-cli.git
          VERSION=$(./node_modules/silverfin-cli/bin/cli.js -V)
          echo "CLI version: ${VERSION}"
      - name: Run liquid tests for updated templates
        run: |
          declare -A HANDLES_BY_FIRM
          declare -A ACCOUNT_TEMPLATES_BY_FIRM
          declare -a ERRORS

          # Function to resolve firm ID from config
          resolve_firm_id() {
            local config_file="$1"
            local firm_id=""
            local test_firm_id=$(cat "${config_file}" | jq -r ".test_firm_id // empty")
            local available_ids=$(cat "${config_file}" | jq -r ".id | keys[]" 2>/dev/null || echo "")
            
            # 1. Template-specific test_firm_id (highest priority)
            if [[ -n "$test_firm_id" && "$test_firm_id" != "null" ]]; then
              for id in $available_ids; do
                if [[ "$id" == "$test_firm_id" ]]; then
                  firm_id="$test_firm_id"
                  echo "Using configured test_firm_id: ${firm_id}"
                  break
                fi
              done
            fi
            
            # 2. Environment variable fallback
            if [[ -z "$firm_id" && -n "$SF_TEST_FIRM_ID" ]]; then
              for id in $available_ids; do
                if [[ "$id" == "$SF_TEST_FIRM_ID" ]]; then
                  firm_id="$SF_TEST_FIRM_ID"
                  echo "Using SF_TEST_FIRM_ID environment variable: ${firm_id}"
                  break
                fi
              done
            fi
            
            # 3. Default: first available firm ID
            if [[ -z "$firm_id" ]]; then
              firm_id=$(cat "${config_file}" | jq -r ".id | keys_unsorted | first" | tr -d '"')
              echo "Using first available firm ID: ${firm_id}"
            fi
            
            echo "$firm_id"
          }

          # Function to parse test output and collect errors
          parse_test_output() {
            local output="$1"
            local current_template=""
            
            while IFS= read -r line || [[ -n "$line" ]]; do
              # Skip empty lines
              if [[ -z "$line" ]]; then
                continue
              fi
              
              # Check for indented failed test name (e.g., "  test_name: FAILED")
              if [[ "$line" =~ ^[[:space:]]+([^:]+):[[:space:]]+FAILED ]]; then
                local test_name=$(echo "${BASH_REMATCH[1]}" | xargs)
                if [[ -n "$current_template" ]]; then
                  ERRORS+=("${current_template}: ${test_name}")
                fi
                continue
              fi
              
              # Match template: PASSED or template: FAILED (may have trailing content like timestamps)
              line=$(echo "$line" | xargs)
              if [[ "$line" =~ ^([^:]+):[[:space:]]+(PASSED|FAILED) ]]; then
                current_template=$(echo "${BASH_REMATCH[1]}" | xargs)
                local status="${BASH_REMATCH[2]}"
                
                if [[ "$status" == "PASSED" ]]; then
                  echo "${current_template}: passed"
                elif [[ "$status" == "FAILED" ]]; then
                  echo "${current_template}: failed"
                  ERRORS+=("${current_template}")
                fi
              fi
            done <<< "$output"
          }

          # First pass: collect all templates and group by firm ID
          for CURRENT_DIR in ${{ env.CHANGED_TEMPLATES }}; do
            echo "Checking ${CURRENT_DIR}"
            TEMPLATE_DIR="${CURRENT_DIR}"
            
            while [[ "${TEMPLATE_DIR}" != "." ]]; do
              if [[ -e "${TEMPLATE_DIR}/config.json" ]]; then
                HANDLE_OR_NAME=$(cat ${TEMPLATE_DIR}/config.json | jq -r ".handle // .name")
                FIRM_ID=$(resolve_firm_id "${TEMPLATE_DIR}/config.json")
                
                # Categorize by template type and add to appropriate bucket
                if [[ "${CURRENT_DIR}" == *reconciliation_texts* ]]; then
                  if [[ -z "${HANDLES_BY_FIRM[${FIRM_ID}]}" ]]; then
                    HANDLES_BY_FIRM[${FIRM_ID}]="${HANDLE_OR_NAME}"
                  else
                    HANDLES_BY_FIRM[${FIRM_ID}]="${HANDLES_BY_FIRM[${FIRM_ID}]} ${HANDLE_OR_NAME}"
                  fi
                elif [[ "${CURRENT_DIR}" == *account_templates* ]]; then
                  if [[ -z "${ACCOUNT_TEMPLATES_BY_FIRM[${FIRM_ID}]}" ]]; then
                    ACCOUNT_TEMPLATES_BY_FIRM[${FIRM_ID}]="${HANDLE_OR_NAME}"
                  else
                    ACCOUNT_TEMPLATES_BY_FIRM[${FIRM_ID}]="${ACCOUNT_TEMPLATES_BY_FIRM[${FIRM_ID}]} ${HANDLE_OR_NAME}"
                  fi
                fi
                break
              else
                echo "Config file not found in ${TEMPLATE_DIR}"
                TEMPLATE_DIR="$(dirname "${TEMPLATE_DIR}")"
              fi
            done
          done

          # Second pass: run tests in batches
          # FETCH THE NEWEST VERSION OF THE TOKENS FROM THE SECRETS, IN CASE THEY WERE UPDATED BY THE INITIATION OF A CONCURRENT WORKFLOW
          echo '${{ secrets.CONFIG_JSON }}' > $HOME/.silverfin/config.json

          # Run tests for reconciliation handles grouped by firm ID
          for FIRM_ID in "${!HANDLES_BY_FIRM[@]}"; do
            HANDLES="${HANDLES_BY_FIRM[${FIRM_ID}]}"
            echo "Running tests for handles: ${HANDLES} in firm ${FIRM_ID}"
            
            # Build command with space-delimited handles
            OUTPUT=$(node ./node_modules/silverfin-cli/bin/cli.js run-test -h ${HANDLES} -f "${FIRM_ID}" --status 2>&1)
            parse_test_output "$OUTPUT"
          done

          # Run tests for account templates grouped by firm ID
          for FIRM_ID in "${!ACCOUNT_TEMPLATES_BY_FIRM[@]}"; do
            TEMPLATE_NAMES="${ACCOUNT_TEMPLATES_BY_FIRM[${FIRM_ID}]}"
            echo "Running tests for account templates: ${TEMPLATE_NAMES} in firm ${FIRM_ID}"
            
            # Build command with space-delimited quoted account template names
            # Convert space-separated names to quoted space-separated names
            QUOTED_NAMES=""
            for name in ${TEMPLATE_NAMES}; do
              if [[ -z "$QUOTED_NAMES" ]]; then
                QUOTED_NAMES="'${name}'"
              else
                QUOTED_NAMES="${QUOTED_NAMES} '${name}'"
              fi
            done
            
            OUTPUT=$(node ./node_modules/silverfin-cli/bin/cli.js run-test -at ${QUOTED_NAMES} -f "${FIRM_ID}" --status 2>&1)
            parse_test_output "$OUTPUT"
          done

          # CHECK ERRORS PRESENT
          if [ ${#ERRORS[@]} -eq 0 ]; then
            echo "All tests have passed"
          else
            echo "Errors: ${ERRORS[@]}, please run the tests locally to fix the errors"
            exit 1
          fi

